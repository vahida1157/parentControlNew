<!DOCTYPE html>
<html lang="__LANG__" dir="__DIR__">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #fdfbfb; font-family: sans-serif; text-align: center;
        }
        .card {
            padding: 40px 20px; border-radius: 30px; background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 80%; border-top: 8px solid #EF4444;
        }
        .icon {
            font-size: 100px; margin-bottom: 10px;
            /* A fun bouncing animation for kids */
            animation: bounce 2s infinite;
        }
        h1 { color: #1F2937; font-size: 24px; margin: 0; font-weight: 900;}
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
<div class="card">
    <!-- A universal visual cue, much better for kids -->
    <div class="icon">🛑</div>
    <h1>__TITLE__</h1>
</div>
</body>
</html>
